<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NURA - Tu bienestar comienza aquí</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7f6;
            color: #263238;
        }

        button {
            font-family: inherit;
            cursor: pointer;
        }

        .app {
            min-height: 100vh;
        }

        /* =========================
           PORTADA
        ========================= */

        .portada {
            min-height: 100vh;
            background-image: url("./nura-portada.png");
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding: 30px 20px;
        }

        .portada-card {
            width: 100%;
            max-width: 520px;
            background: rgba(255,255,255,0.96);
            border-radius: 28px;
            padding: 32px 28px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.18);
            text-align: center;
        }

        .logo {
            font-size: 42px;
            font-weight: 800;
            letter-spacing: 5px;
            color: #1b8f72;
            margin-bottom: 8px;
        }

        .portada-card h1 {
            font-size: 26px;
            margin-bottom: 12px;
        }

        .portada-card p {
            line-height: 1.6;
            color: #607d7a;
            margin-bottom: 24px;
        }

        .btn-principal {
            width: 100%;
            border: none;
            padding: 16px;
            border-radius: 16px;
            color: white;
            font-size: 17px;
            font-weight: bold;
            background: linear-gradient(135deg, #1b8f72, #55b78e);
            box-shadow: 0 8px 18px rgba(27,143,114,0.25);
        }

        .btn-principal:hover {
            transform: translateY(-1px);
        }

        .mini-text {
            margin-top: 16px;
            font-size: 13px;
            color: #78909c;
        }

        /* =========================
           CONTENEDORES
        ========================= */

        .pantalla {
            min-height: 100vh;
            padding: 30px 20px;
        }

        .contenedor {
            width: 100%;
            max-width: 850px;
            margin: auto;
        }

        .cabecera {
            text-align: center;
            margin-bottom: 25px;
        }

        .cabecera .logo {
            font-size: 32px;
        }

        .cabecera h2 {
            margin-bottom: 8px;
        }

        .cabecera p {
            color: #78909c;
        }

        .card {
            background: white;
            border-radius: 22px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.07);
        }

        /* =========================
           FORMULARIO
        ========================= */

        .paso {
            display: none;
        }

        .paso.activo {
            display: block;
        }

        .paso h3 {
            font-size: 23px;
            margin-bottom: 10px;
        }

        .paso p {
            color: #78909c;
            margin-bottom: 22px;
        }

        input[type="text"],

            width: 100%;
            padding: 15px;
            border: 2px solid #e0e7e5;
            border-radius: 14px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #1b8f72;
        }

        .opciones {
            display: grid;
            gap: 12px;

        .opcion {

            border-radius: 15px;
            padding: 16px;
            background: white;
            transition: 0.2s;
        }

        .opcion:hover {
            border-color: #8bcbb8;
        }

        .opcion.seleccionada {
            border-color: #1b8f72;
            background: #eaf7f2;
        }

        .opcion input {
            display: none;
        }

        .opcion strong {
            display: block;
            margin-bottom: 4px;
        }

        .opcion small {
            color: #78909c;
        }

        .alimentos-encabezado {

            justify-content: space-between;
            align-items: center;
            gap: 10px;

            background: #eaf7f2;
            color: #16745d;
            padding: 8px 10px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: bold;
        }

        .alimentos-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 9px;
        }

        .alimento-btn {
            border: 2px solid #e0e7e5;
            background: white;
            color: #455a64;
            padding: 12px 9px;
            border-radius: 13px;
            font-size: 13px;
            min-height: 48px;
        }

        .alimento-btn.seleccionado {
            border-color: #1b8f72;
            background: #eaf7f2;
            color: #16745d;
            font-weight: bold;
        }

        .alimento-btn.evitado {
            border-color: #d58b8b;
            background: #fff2f2;
            color: #a94444;
            font-weight: bold;
        }

        .contador-alimentos {
            margin-top: 12px;
            color: #1b8f72;
            font-size: 13px;
            font-weight: bold;
            text-align: center;
        }

        .alimentos-evitar {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #e2e9e6;
        }

        .alimentos-evitar > strong {
            display: block;
            margin-bottom: 5px;
        }

        .alimentos-evitar > small {
            display: block;
            color: #78909c;
            margin-bottom: 12px;
        }

        .dias-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .dia-btn {
            border: 2px solid #e0e7e5;
            background: white;
            padding: 15px 10px;
            border-radius: 14px;
            font-weight: bold;
            color: #455a64;
        }

        .dia-btn.seleccionado {
            background: #eaf7f2;
            border-color: #1b8f72;
            color: #16745d;
        }

        .contador-dias {
            margin-top: 15px;
            text-align: center;
            color: #1b8f72;
            font-weight: bold;
        }

        .navegacion {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        .btn-secundario,
        .btn-siguiente {
            flex: 1;
            padding: 15px;
            border-radius: 14px;
            border: none;
            font-weight: bold;
        }

        .btn-secundario {
            background: #eceff1;
            color: #455a64;
        }

        .btn-siguiente {
            background: #1b8f72;
            color: white;
        }

        .progreso {
            height: 7px;
            background: #e8eeee;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 25px;
        }

        .progreso-barra {
            height: 100%;
            background: linear-gradient(90deg, #1b8f72, #55b78e);
            width: 10%;
            transition: 0.3s;
        }

        /* =========================
           PLAN SEMANAL
        ========================= */

        .bienvenida {
            background: linear-gradient(135deg, #1b8f72, #55b78e);
            color: white;
            border-radius: 22px;
            padding: 25px;
            margin-bottom: 20px;
        }

        .bienvenida h2 {
            margin-bottom: 8px;
        }

        .semana {
            display: grid;
            gap: 20px;
        }

        .dia-card {
            background: white;
            border-radius: 22px;
            padding: 22px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.07);
        }

        .dia-titulo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 18px;
        }

        .dia-titulo h3 {
            font-size: 21px;
        }

        .badge {
            background: #eaf7f2;
            color: #16745d;
            padding: 7px 11px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .badge-descanso {
            background: #edf5ef;
            color: #4d7758;
        }

        .comida {
            border: 1px solid #e6ecea;
            border-radius: 17px;
            padding: 17px;
            margin-bottom: 12px;
        }

        .comida:last-child {
            margin-bottom: 0;
        }

        .comida-header {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            align-items: center;
            margin-bottom: 8px;
        }

        .comida-header strong {
            font-size: 15px;
        }

        .btn-cambiar {
            border: none;
            background: #edf7f4;
            color: #16745d;
            padding: 7px 10px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: bold;
        }

        .comida-texto {
            color: #455a64;
            line-height: 1.5;
        }

        .entrenamiento {
            margin-top: 18px;
            padding: 18px;
            border-radius: 17px;
            background: #f1faf7;
            border-left: 5px solid #1b8f72;
        }

        .entrenamiento h4 {
            margin-bottom: 12px;
            color: #16745d;
        }

        .ejercicio {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 9px 0;
            border-bottom: 1px solid #dcebe5;
            font-size: 14px;
        }

        .ejercicio:last-child {
            border-bottom: none;
        }

        .descanso {
            margin-top: 18px;
            padding: 18px;
            border-radius: 17px;
            background: #f2f8f3;
            color: #48644e;
            line-height: 1.5;
        }

        .boton-entrenar {
            width: 100%;
            margin-top: 15px;
            border: none;
            background: #1b8f72;
            color: white;
            padding: 14px;
            border-radius: 13px;
            font-weight: bold;
        }

        .hablar {
            position: sticky;
            bottom: 15px;
            width: 100%;
            border: none;
            padding: 16px;
            border-radius: 17px;
            background: #263238;
            color: white;
            font-weight: bold;
            font-size: 15px;
            margin-top: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        /* =========================
           ENTRENAMIENTO
        ========================= */

        .entrenamiento-pantalla {
            text-align: center;
        }

        .ejercicio-numero {
            color: #1b8f72;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .ejercicio-grande {
            font-size: 30px;
            margin-bottom: 12px;
        }

        .series-info {
            color: #78909c;
            margin-bottom: 25px;
        }

        .timer {
            font-size: 65px;
            font-weight: bold;
            color: #1b8f72;
            margin: 25px 0;
        }

        .motivacion {
            background: #eaf7f2;
            color: #16745d;
            border-radius: 17px;
            padding: 18px;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .controles {
            display: grid;
            gap: 10px;
        }

        .bloque-entrenamiento { margin-top: 18px; padding: 16px; border-radius: 17px; background: #f8fbfa; border: 1px solid #e2ece8; }
        .bloque-entrenamiento h5 { color: #16745d; margin-bottom: 10px; font-size: 14px; }
        .mini-ejercicio { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid #e6eeeb; font-size: 13px; }
        .mini-ejercicio:last-child { border-bottom: none; }
        .cardio-box { margin-top: 14px; padding: 14px; border-radius: 15px; background: #f1f7ff; color: #40556a; }
        .calma-box { margin-top: 12px; padding: 14px; border-radius: 15px; background: #f2f8f3; color: #48644e; }
        .sesion-badge { display: inline-block; margin-top: 5px; color: #16745d; font-size: 12px; font-weight: bold; }
        .preparacion-texto {
            color: #607d7a;
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 12px;
        }

        .maquinas-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .maquina-btn {
            border: 2px solid #e0e7e5;
            background: white;
            color: #455a64;
            padding: 11px 8px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 13px;
        }

        .maquina-btn:hover,

            border-color: #1b8f72;
            background: #eaf7f2;
            color: #16745d;
        }

        .preparacion-seleccion {
            margin-top: 10px;
            color: #607d7a;
            font-size: 12px;
            text-align: center;
        }

        .preparacion-resumen {
            margin-bottom: 18px;
            padding: 14px;
            border-radius: 15px;
            background: #f1f7ff;
            color: #40556a;
            line-height: 1.5;
        }

        .serie-indicador {
            display: inline-block;
            background: #eaf7f2;
            color: #16745d;
            padding: 8px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 10px;

            font-size: 15px;
            margin-bottom: 18px;
        }

            background: #f1f7ff;

            padding: 18px;

            color: #40556a;
            margin-bottom: 8px;

        }

        }

            display:grid;
            grid-template-columns:repeat(2,1fr);
            gap:10px;
            margin:20px 0;
        }

        .resumen-sesion div {
            background:#f5f8f7;
            border-radius:15px;
            padding:14px 10px;
            text-align:center;
        }

        .resumen-sesion strong {
            display:block;
            color:#16745d;
            font-size:20px;
            margin-bottom:4px;
        }

        .resumen-sesion span {
            color:#607d7a;
            font-size:12px;
        }

        .historial-box {
            background:#f7faf9;
            border-radius:18px;
            padding:16px;
            margin-top:18px;
            text-align:left;
        }

        .historial-item {
            background:white;
            border:1px solid #e6eeeb;
            border-radius:14px;
            padding:12px 14px;
            margin-top:10px;
        }

        .historial-item strong {
            color:#16745d;
        }

        .historial-meta {
            color:#607d7a;
            font-size:12px;
            margin-top:5px;
            line-height:1.5;
        }

        .progreso-grid {
            display:grid;
            grid-template-columns:repeat(3,1fr);
            gap:10px;
            margin:18px 0;
        }

        .progreso-card {
            background:#f5f8f7;
            border-radius:15px;
            padding:14px 10px;
            text-align:center;
        }

        .progreso-card strong {
            display:block;
            color:#16745d;
            font-size:22px;
            margin-bottom:4px;
        }

        .progreso-card span {
            color:#607d7a;
            font-size:11px;
        }

        .progreso-mensaje {
            background:#eef8f4;
            border-radius:15px;
            padding:14px 16px;
            color:#315d50;
            line-height:1.6;
            margin-bottom:18px;
        }

            .progreso-grid {
                grid-template-columns:1fr;
            }
        }

        .enfriamiento-lista {
            text-align:left;
            background:#f2f8f3;
            border-radius:15px;
            padding:14px 18px;
            color:#48644e;
            line-height:1.8;
            margin:18px 0;

           RESPONSIVE
        ========================= */

            .portada {

                align-items: flex-end;
                background-position: center top;
            }

            .portada-card {
                border-radius: 24px;
                padding: 26px 20px;
            }

            .logo {
                font-size: 36px;
            }

                font-size: 23px;

                padding: 18px 12px;
            }

            .card, .dia-card {
                padding: 18px;

            }

            .comida-header, .dia-titulo {
                align-items: flex-start;

            .comida-header {

            }

            .mini-ejercicio {
                flex-direction: column;
                gap: 3px;
            }

            .maquina-btn {
                min-height: 46px;
                font-size: 12px;
            }

            .mini-ejercicio strong {
                color: #607d7a;
            }

            .ejercicio-grande {
                font-size: 25px;
            }

            .timer {
                font-size: 56px;
            }

            .navegacion {
                position: sticky;
                bottom: 8px;
                background: rgba(255,255,255,0.96);
                padding-top: 8px;
            }
        }

        @media (min-width: 650px) {
            .alimentos-grid {
                grid-template-columns: repeat(3, 1fr);
            }

            .dias-grid {
                grid-template-columns: repeat(4, 1fr);
            }

            .portada {
                align-items: center;
            }
        }
    </style>
</head>

    function crearOpcion(campo, valor, titulo, descripcion = "") {

        const seleccionado = datosNura[campo] === valor;

        return `
            <div
                class="opcion ${seleccionado ? "seleccionada" : ""}"
                onclick="seleccionarOpcion('${campo}', '${valor}', this)">

                <input
                    type="radio"
                    name="${campo}"
                    value="${valor}">

                <strong>${titulo}</strong>

                ${descripcion ? `<small>${descripcion}</small>` : ""}

            </div>
        `;
    }


    function seleccionarOpcion(campo, valor, elemento) {

        datosNura[campo] = valor;

        const opciones = elemento.parentElement.querySelectorAll(".opcion");

        opciones.forEach(opcion => {
            opcion.classList.remove("seleccionada");
        });

        elemento.classList.add("seleccionada");
    }


    function toggleAlimento(tipo, valor) {

        if (tipo === "incluidos") {
            if (datosNura.alimentosIncluidos.includes(valor)) {
                datosNura.alimentosIncluidos = datosNura.alimentosIncluidos.filter(a => a !== valor);
            } else {
                datosNura.alimentosIncluidos.push(valor);
                datosNura.alimentosEvitar = datosNura.alimentosEvitar.filter(a => a !== valor);
            }
        }

        if (tipo === "evitar") {
            if (datosNura.alimentosEvitar.includes(valor)) {
                datosNura.alimentosEvitar = datosNura.alimentosEvitar.filter(a => a !== valor);
            } else {
                datosNura.alimentosEvitar.push(valor);
                datosNura.alimentosIncluidos = datosNura.alimentosIncluidos.filter(a => a !== valor);
            }
        }

        const incluye = document.getElementById(`incluye-${valor}`);
        const evita = document.getElementById(`evita-${valor}`);

        if (incluye) incluye.classList.toggle("seleccionado", datosNura.alimentosIncluidos.includes(valor));
        if (evita) evita.classList.toggle("evitado", datosNura.alimentosEvitar.includes(valor));

        const contador = document.getElementById("contadorIncluidos");
        if (contador) {
            contador.textContent = `${datosNura.alimentosIncluidos.length} ${datosNura.alimentosIncluidos.length === 1 ? "alimento seleccionado" : "alimentos seleccionados"}`;
        }
    }


    function seleccionarTodosAlimentos() {

        datosNura.alimentosIncluidos = alimentosDisponibles
            .map(alimento => alimento[0])
            .filter(valor => !datosNura.alimentosEvitar.includes(valor));

        document.querySelectorAll(".alimento-btn:not(.evitar-btn)").forEach(boton => {
            const valor = boton.id.replace("incluye-", "");
            boton.classList.toggle("seleccionado", datosNura.alimentosIncluidos.includes(valor));
        });

        const contador = document.getElementById("contadorIncluidos");
        if (contador) {
            contador.textContent = `${datosNura.alimentosIncluidos.length} alimentos seleccionados`;
        }
    }


    function seleccionarDia(indice) {

        const dia = diasSemana[indice];

        if (datosNura.dias.includes(dia)) {

            datosNura.dias = datosNura.dias.filter(
                d => d !== dia
            );

        } else {

            datosNura.dias.push(dia);
        }

        const boton = document.getElementById(`dia-${indice}`);

        boton.classList.toggle(
            "seleccionado",
            datosNura.dias.includes(dia)
        );

        actualizarContadorDias();
    }


    function actualizarContadorDias() {

        const contador = document.getElementById("contadorDias");

        if (!contador) {
            return;
        }

        const cantidad = datosNura.dias.length;

        contador.textContent =
            `${cantidad} ${cantidad === 1 ? "día" : "días"} seleccionados`;
    }

        if (pasoActual === 7 && !datosNura.actividad) {

        } else {

        document.querySelectorAll(".paso").forEach(paso => {

        if (paso) {

        const barra = document.getElementById("progresoBarra");

        if (barra) {

        if (siguiente) {

        }

    function menuEsCompatible(menu) {

        const evitar = datosNura.alimentosEvitar || [];
        const incluidos = datosNura.alimentosIncluidos || [];

        if (menu.tags.some(tag => evitar.includes(tag))) {
            return false;
        }

        return menu.tags.some(tag => incluidos.includes(tag));
    }


    function obtenerMenuSemana(lista, usados) {

        let disponibles = lista.filter(menuEsCompatible);

        if (disponibles.length === 0) {
            disponibles = lista.filter(menu => !menu.tags.some(tag => (datosNura.alimentosEvitar || []).includes(tag)));
        }

        if (disponibles.length === 0) {
            disponibles = lista;
        }

        const noUsados = disponibles.filter(menu => !usados.includes(menu.texto));
        const pool = noUsados.length ? noUsados : disponibles;
        const elegido = pool[Math.floor(Math.random() * pool.length)];

        usados.push(elegido.texto);
        return elegido.texto;
    }


    function generarPlan() {

        const letrasSesiones = ["A", "B", "C", "D"];
        let numeroSesion = 0;
        const usadosDesayuno = [];
        const usadosComida = [];
        const usadosCena = [];

        const semana = diasSemana.map(dia => {

            const entrenar = datosNura.dias.includes(dia);
            const letraSesion = entrenar
                ? letrasSesiones[numeroSesion % letrasSesiones.length]
                : null;

            if (entrenar) {
                numeroSesion++;
            }

            return {
                dia,
                entrenar,
                sesion: letraSesion,
                desayuno: obtenerMenuSemana(menuDesayuno, usadosDesayuno),
                comida: obtenerMenuSemana(menuComida, usadosComida),
                cena: obtenerMenuSemana(menuCena, usadosCena)
            };
        });

        mostrarPlanSemanal(semana);
    }

    function obtenerRutinaSesion(letraSesion) {

        const nivel = datosNura.experiencia || "principiante";
        const rutinasNivel = rutinasPorSesion[nivel] || rutinasPorSesion.principiante;

        return rutinasNivel[letraSesion || "A"] || rutinasNivel.A;

    function obtenerSeriesParaNivel() {

        if (datosNura.experiencia === "avanzado") {
            return 4;
        }

        if (datosNura.experiencia === "intermedio") {
            return 3;
        }

        return 2;
    }


    function obtenerDatosEjercicio(ejercicio) {

        const texto = ejercicio[1] || "";
        const coincidencia = texto.match(/^(\d+)\s+series\s+×\s+(.+)$/i);

        if (!coincidencia) {
            return {
                nombre: ejercicio[0],
                series: 1,
                objetivo: texto
            };
        }

        return {
            nombre: ejercicio[0],
            series: obtenerSeriesParaNivel(),
            objetivo: coincidencia[2]
        };
    }


    function formatearTextoEjercicio(ejercicio) {

        const datos = obtenerDatosEjercicio(ejercicio);

        if (!ejercicio[1].match(/^\d+\s+series\s+×\s+(.+)$/i)) {
            return ejercicio[1];
        }

        return `${datos.series} series × ${datos.objetivo}`;
    }

        const opciones = compatibles.length ? compatibles : lista.filter(menu => !menu.tags.some(tag => (datosNura.alimentosEvitar || []).includes(tag)) && menu.texto !== actual);

    function saltarPreparacion(segundosTotales) {

        if (intervaloTimer) {
            clearInterval(intervaloTimer);
            intervaloTimer = null;
        }

        if (window.momentoCardioNura === "inicio") {
            mostrarEntrenamiento();
            return;

        mostrarEntrenamiento();
    }


    function comenzarPreparacion(segundosTotales) {

        if (intervaloTimer) {
            clearInterval(intervaloTimer);
        }

        let segundos = segundosTotales;
        const timer = document.getElementById("timer");

        if (!timer) {
            return;
        }

        timer.textContent = formatearTiempo(segundos);

        intervaloTimer = setInterval(() => {
            segundos--;
            timer.textContent = formatearTiempo(segundos);

            if (segundos <= 0) {
                clearInterval(intervaloTimer);
                intervaloTimer = null;
                alert("¡Preparación terminada! Vamos con tu entrenamiento. 💪");
                mostrarEntrenamiento();
            }
        }, 1000);
    }


    function terminarPreparacion() {

        if (intervaloTimer) {
            clearInterval(intervaloTimer);
            intervaloTimer = null;

        mostrarEntrenamiento();

    function mostrarEntrenamiento() {

        const rutina = obtenerRutinaSesion(sesionActual);

        if (ejercicioActual >= rutina.ejercicios.length) {
            finalizarEntrenamiento();
            return;
        }

        const ejercicio = rutina.ejercicios[ejercicioActual];
        const datosEjercicio = obtenerDatosEjercicio(ejercicio);

        if (serieActual > datosEjercicio.series) {
            serieActual = 1;
            ejercicioActual++;

            if (ejercicioActual >= rutina.ejercicios.length) {
                finalizarEntrenamiento();
                return;
            }

            mostrarEntrenamiento();
            return;
        }

        document.getElementById("app").innerHTML = `

                            Ejercicio ${ejercicioActual + 1} de ${rutina.ejercicios.length}
                        </div>

                        <h2 class="ejercicio-grande">${datosEjercicio.nombre}</h2>

                        <div class="serie-indicador">
                            Serie ${serieActual} de ${datosEjercicio.series}
                        </div>

                        <div class="objetivo-serie">
                            Objetivo: <strong>${datosEjercicio.objetivo}</strong>
                        </div>

                        <div class="motivacion">
                            ${frasesMotivacion[ejercicioActual % frasesMotivacion.length]}
                            <br><br>
                            Haz las repeticiones con buena técnica y a un ritmo que puedas controlar.
                        </div>

                        <div class="controles">
                            <button class="btn-siguiente" onclick="terminarSerie()">
                                ✅ Terminé esta serie
                            </button>

                            <button class="btn-secundario" onclick="siguienteEjercicio()">
                                ⏭️ Pasar al siguiente ejercicio
                            </button>

                            <button class="btn-secundario" onclick="mostrarPlanDespuesDeEntrenamiento()">
                                ← Regresar al plan
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        `;
    }


    function terminarSerie() {

        if (intervaloTimer) {
            clearInterval(intervaloTimer);
            intervaloTimer = null;
        }

        const rutina = obtenerRutinaSesion(sesionActual);
        const ejercicio = rutina.ejercicios[ejercicioActual];
        const datosEjercicio = obtenerDatosEjercicio(ejercicio);

        seriesCompletadasSesion++;

        if (serieActual >= datosEjercicio.series) {
            serieActual = 1;
            ejercicioActual++;
            mostrarEntrenamiento();
            return;
        }

        mostrarDescansoEntreSeries(datosEjercicio);
    }


    function mostrarDescansoEntreSeries(datosEjercicio) {

        const descanso = 60;

        document.getElementById("app").innerHTML = `
            <div class="pantalla">
                <div class="contenedor">
                    <div class="card entrenamiento-pantalla">
                        <div class="logo">NURA</div>

                        <div class="ejercicio-numero">🌿 Descanso entre series</div>

                        <h2 class="ejercicio-grande">Recupera y respira</h2>

                        <div class="descanso-panel">
                            <h3>Serie ${serieActual} de ${datosEjercicio.series} completada</h3>
                            <p>Descansa antes de continuar. No necesitas apresurarte.</p>
                            <div class="timer" id="timer">01:00</div>
                        </div>

                        <div class="controles">
                            <button class="btn-siguiente" onclick="comenzarDescanso(${descanso})">
                                ▶️ Comenzar descanso
                            </button>
                            <button class="btn-secundario" onclick="saltarDescanso()">
                                ⏭️ Continuar sin esperar
                            </button>
                            <button class="btn-secundario" onclick="mostrarPlanDespuesDeEntrenamiento()">
                                ← Regresar al plan
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        `;
    }


    function comenzarDescanso(segundosTotales) {

        if (intervaloTimer) {
            clearInterval(intervaloTimer);
        }

        let segundos = segundosTotales;
        const timer = document.getElementById("timer");

        if (!timer) {
            return;
        }

        timer.textContent = formatearTiempo(segundos);

        intervaloTimer = setInterval(() => {
            segundos--;
            timer.textContent = formatearTiempo(segundos);

            if (segundos <= 0) {
                clearInterval(intervaloTimer);
                intervaloTimer = null;
                serieActual++;
                mostrarEntrenamiento();
            }
        }, 1000);
    }


    function saltarDescanso() {

        if (intervaloTimer) {
            clearInterval(intervaloTimer);
            intervaloTimer = null;
        }

        serieActual++;
        mostrarEntrenamiento();
    }


    function comenzarTemporizador() {
        // Conservamos esta función para compatibilidad con versiones anteriores.
        terminarSerie();
    }


    function formatearTiempo(segundos) {

        const minutos = Math.floor(segundos / 60);
        const segundosRestantes = segundos % 60;

        return `${String(minutos).padStart(2, "0")}:${String(segundosRestantes).padStart(2, "0")}`;
    }


    function siguienteEjercicio() {

        if (intervaloTimer) {
            clearInterval(intervaloTimer);
            intervaloTimer = null;
        }

        ejercicioActual++;
        serieActual = 1;
        mostrarEntrenamiento();
    }


    function finalizarEntrenamiento() {

        const cardioAlFinal = window.momentoCardioNura === "final";

        if (cardioAlFinal) {
            mostrarCardioFinal();
            return;
        }

        mostrarEnfriamiento();
    }


    function mostrarCardioFinal() {

        const maquina = indiceDiaActual !== null
            ? datosNura.preparacionMaquina[indiceDiaActual]
            : null;
        const encontrada = maquinasPreparacion.find(item => item[0] === maquina);
        const nombreMaquina = encontrada ? encontrada[1] : "la máquina que prefieras";

        document.getElementById("app").innerHTML = `
            <div class="pantalla">
                <div class="contenedor">
                    <div class="card entrenamiento-pantalla">
                        <div class="logo">NURA</div>
                        <div class="ejercicio-numero">🏋️ Trabajo principal terminado</div>
                        <h2 class="ejercicio-grande">❤️ Cardio final</h2>
                        <div class="preparacion-resumen">
                            <strong>🚴 ${nombreMaquina}</strong><br>
                            25 minutos a un ritmo cómodo y progresivo.
                        </div>
                        <div class="motivacion">
                            ¡Muy bien! Ahora puedes hacer tu cardio sin prisas. Mantén un ritmo que puedas sostener cómodamente.
                        </div>
                        <div class="timer" id="timer">25:00</div>
                        <div class="controles">
                            <button class="btn-siguiente" onclick="comenzarCardioFinal()">▶️ Comenzar cardio</button>
                            <button class="btn-secundario" onclick="mostrarEnfriamiento()">⏭️ Omitir cardio</button>
                        </div>
                        <div class="calma-box" style="text-align:left;margin-top:20px;">
                            <strong>🌿 Después</strong><br>
                            Vuelta a la calma antes de cerrar tu sesión.
                        </div>
                    </div>
                </div>
            </div>
        `;
    }


    function comenzarCardioFinal() {

        if (intervaloTimer) {
            clearInterval(intervaloTimer);
        }

        let segundos = 1500;
        const timer = document.getElementById("timer");

        if (!timer) return;

        timer.textContent = formatearTiempo(segundos);

        intervaloTimer = setInterval(() => {
            segundos--;
            timer.textContent = formatearTiempo(segundos);

            if (segundos <= 0) {
                clearInterval(intervaloTimer);
                intervaloTimer = null;
                mostrarEnfriamiento();
            }
        }, 1000);
    }


    function mostrarEnfriamiento() {

        if (intervaloTimer) {
            clearInterval(intervaloTimer);
            intervaloTimer = null;
        }

        document.getElementById("app").innerHTML = `
            <div class="pantalla">
                <div class="contenedor">
                    <div class="card entrenamiento-pantalla">
                        <div class="logo">NURA</div>
                        <div class="ejercicio-numero">🌿 Último paso</div>
                        <h2 class="ejercicio-grande">Vuelta a la calma</h2>
                        <div class="preparacion-resumen">
                            <strong>Respira y baja el ritmo poco a poco.</strong><br>
                            Tómate unos minutos antes de dar por terminada tu sesión.
                        </div>
                        <div class="enfriamiento-lista">
                            • Caminata suave o movimiento ligero.<br>
                            • Respiración tranquila y controlada.<br>
                            • Movilidad suave, sin rebotes ni dolor.
                        </div>
                        <div class="timer" id="timer">05:00</div>
                        <div class="motivacion">
                            No necesitas apresurarte. Terminar con calma también forma parte del entrenamiento. 💚
                        </div>
                        <div class="controles">
                            <button class="btn-siguiente" onclick="comenzarEnfriamiento()">
                                ▶️ Comenzar vuelta a la calma
                            </button>
                            <button class="btn-secundario" onclick="finalizarSesionNura()">
                                ⏭️ Terminar sin esperar
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        `;
    }


    function comenzarEnfriamiento() {

        if (intervaloTimer) clearInterval(intervaloTimer);

        let segundos = 300;
        const timer = document.getElementById("timer");
        if (!timer) return;

        timer.textContent = formatearTiempo(segundos);

        intervaloTimer = setInterval(() => {
            segundos--;
            timer.textContent = formatearTiempo(segundos);

            if (segundos <= 0) {
                clearInterval(intervaloTimer);
                intervaloTimer = null;
                finalizarSesionNura();
            }
        }, 1000);
    }


    function guardarSesionEnHistorial(minutosSesion, rutina) {

        const momento = window.momentoCardioNura || "ninguno";
        const maquina = indiceDiaActual !== null
            ? datosNura.preparacionMaquina[indiceDiaActual]
            : null;

        const encontrada = maquinasPreparacion.find(item => item[0] === maquina);

        const registro = {
            fecha: new Date().toLocaleString("es-MX", {
                dateStyle: "medium",
                timeStyle: "short"
            }),
            timestamp: new Date().toISOString(),
            sesion: sesionActual,
            rutina: rutina.nombre,
            minutos: minutosSesion,
            ejercicios: rutina.ejercicios.length,
            series: seriesCompletadasSesion,
            cardio: momento === "inicio" ? "Al inicio" : momento === "final" ? "Al final" : "Sin cardio",
            maquina: encontrada ? encontrada[1] : "Sin máquina"
        };

        historialNura.unshift(registro);
        historialNura = historialNura.slice(0, 10);

        try {
            localStorage.setItem("nuraHistorial", JSON.stringify(historialNura));
        } catch (e) {
            // Si el navegador bloquea almacenamiento local, la sesión continúa normalmente.
        }
    }


    function obtenerFechaRegistro(item) {

        if (item.timestamp) {
            const fecha = new Date(item.timestamp);
            if (!isNaN(fecha.getTime())) return fecha;
        }

        const fechaAnterior = new Date(item.fecha);
        return isNaN(fechaAnterior.getTime()) ? null : fechaAnterior;
    }


    function obtenerInicioSemana() {

        const hoy = new Date();
        const inicio = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate());
        const dia = inicio.getDay();
        const diferencia = dia === 0 ? 6 : dia - 1;
        inicio.setDate(inicio.getDate() - diferencia);
        inicio.setHours(0, 0, 0, 0);
        return inicio;
    }


    function obtenerSesionesSemana() {

        const inicioSemana = obtenerInicioSemana();

        return historialNura.filter(item => {
            const fecha = obtenerFechaRegistro(item);
            if (!fecha) return false;

            // Comparamos solo la fecha calendario local para evitar que la
            // conversión UTC del timestamp mueva una sesión al día anterior.
            const fechaLocal = new Date(
                fecha.getFullYear(),
                fecha.getMonth(),
                fecha.getDate()
            );

            return fechaLocal >= inicioSemana;
        });
    }


    function obtenerMensajeProgreso(totalSemana, objetivoSemana) {

        if (totalSemana === 0) {
            return "Esta semana todavía no has registrado una sesión. No pasa nada: NURA estará aquí cuando estés listo para empezar.";
        }

        if (objetivoSemana > 0 && totalSemana >= objetivoSemana) {
            return `¡Excelente! Ya completaste las ${objetivoSemana} sesiones que habías elegido para esta semana. Ahora toca recuperarte y mantener un ritmo sostenible.`;
        }

        if (objetivoSemana > 0) {
            const faltan = objetivoSemana - totalSemana;
            return `¡Buen comienzo! Llevas ${totalSemana} de ${objetivoSemana} sesiones esta semana. Te faltan ${faltan} para completar los días que elegiste.`;
        }

        return `¡Buen comienzo! Ya llevas ${totalSemana} sesión${totalSemana === 1 ? "" : "es"} registrada${totalSemana === 1 ? "" : "s"}.`;
    }


    function mostrarProgresoNura() {

        const sesionesSemana = obtenerSesionesSemana();
        const totalSemana = sesionesSemana.length;
        const totalSesiones = historialNura.length;
        const objetivoSemana = datosNura.dias.length;

        const ultimo = historialNura[0] || null;
        const ultimaRutina = ultimo ? `${ultimo.rutina}` : "Aún no hay sesiones";
        const ultimoCardio = ultimo
            ? `${ultimo.cardio}${ultimo.maquina && ultimo.maquina !== "Sin máquina" ? ` · ${ultimo.maquina}` : ""}`
            : "—";

        document.getElementById("app").innerHTML = `
            <div class="pantalla">
                <div class="contenedor">
                    <div class="card">
                        <div class="logo">NURA</div>
                        <div class="ejercicio-numero">📈 Tu progreso</div>
                        <h2 class="ejercicio-grande">Así vas avanzando</h2>
                        <p style="color:#607d7a;line-height:1.6;">
                            NURA usa tus sesiones completadas para mostrarte tu constancia, sin convertirla en una competencia.
                        </p>

                        <div class="progreso-grid">
                            <div class="progreso-card">
                                <strong>${totalSemana}</strong>
                                <span>sesiones esta semana</span>
                            </div>
                            <div class="progreso-card">
                                <strong>${objetivoSemana || "—"}</strong>
                                <span>días elegidos</span>
                            </div>
                            <div class="progreso-card">
                                <strong>${totalSesiones}</strong>
                                <span>sesiones registradas</span>
                            </div>
                        </div>

                        <div class="progreso-mensaje">
                            ${obtenerMensajeProgreso(totalSemana, objetivoSemana)}
                        </div>

                        <div class="historial-item">
                            <strong>🏋️ Última sesión</strong>
                            <div class="historial-meta">
                                ${ultimaRutina}<br>
                                ❤️ ${ultimoCardio}
                            </div>
                        </div>

                        <div class="historial-box">
                            <strong>📊 Historial reciente</strong>
                            ${historialNura.length
                                ? historialNura.slice(0, 5).map(item => `
                                    <div class="historial-item">
                                        <strong>Sesión ${item.sesion} · ${item.rutina}</strong>
                                        <div class="historial-meta">
                                            ${item.fecha}<br>
                                            ${item.ejercicios} ejercicios · ${item.series} series · ${item.minutos} min
                                        </div>
                                    </div>
                                `).join("")
                                : `<div class="historial-item"><div class="historial-meta">Todavía no hay sesiones registradas.</div></div>`}
                        </div>

                        <button class="btn-siguiente" onclick="mostrarHistorialNura()">
                            📊 Ver historial completo
                        </button>
                        <button class="btn-secundario" style="width:100%;margin-top:10px;" onclick="generarPlan()">
                            📅 Volver a mi semana
                        </button>
                    </div>
                </div>
            </div>
        `;
    }


    function mostrarHistorialNura() {

        const registros = historialNura.length
            ? historialNura.map(item => `
                <div class="historial-item">
                    <strong>Sesión ${item.sesion} · ${item.rutina}</strong>
                    <div class="historial-meta">
                        ${item.fecha}<br>
                        ${item.ejercicios} ejercicios · ${item.series} series completadas · ${item.minutos} min<br>
                        ❤️ Cardio: ${item.cardio}${item.maquina !== "Sin máquina" ? ` · ${item.maquina}` : ""}
                    </div>
                </div>
            `).join("")
            : `<div class="historial-item">
                    <strong>Aún no hay sesiones registradas.</strong>
                    <div class="historial-meta">Cuando completes tu primera sesión, aparecerá aquí.</div>
               </div>`;

        document.getElementById("app").innerHTML = `
            <div class="pantalla">
                <div class="contenedor">
                    <div class="card">
                        <div class="logo">NURA</div>
                        <div class="ejercicio-numero">📊 Tu progreso</div>
                        <h2 class="ejercicio-grande">Historial de sesiones</h2>
                        <p style="color:#607d7a;line-height:1.6;">
                            Aquí NURA irá registrando tus sesiones completadas para que puedas ver tu constancia.
                        </p>
                        <div class="historial-box">
                            ${registros}
                        </div>
                        <button class="btn-siguiente" onclick="mostrarProgresoNura()">
                            📈 Ver mi progreso
                        </button>
                        <button class="btn-secundario" style="width:100%;margin-top:10px;" onclick="generarPlan()">
                            📅 Volver a mi semana
                        </button>
                    </div>
                </div>
            </div>
        `;
    }

    function finalizarSesionNura() {

        if (intervaloTimer) {
            clearInterval(intervaloTimer);
            intervaloTimer = null;
        }

        const segundosSesion = inicioSesionNura
            ? Math.max(0, Math.round((Date.now() - inicioSesionNura) / 1000))
            : 0;

        const minutosSesion = Math.max(1, Math.round(segundosSesion / 60));
        const rutina = obtenerRutinaSesion(sesionActual);
        const totalEjercicios = rutina.ejercicios.length;

        guardarSesionEnHistorial(minutosSesion, rutina);

        document.getElementById("app").innerHTML = `
            <div class="pantalla">
                <div class="contenedor">
                    <div class="card entrenamiento-pantalla">
                        <div class="logo">NURA</div>
                        <div class="ejercicio-numero">✨ Sesión completada</div>
                        <h2 class="ejercicio-grande">¡Excelente trabajo!</h2>
                        <p style="margin:10px 0 20px;color:#607d7a;line-height:1.6;">
                            Terminaste tu sesión de <strong>${rutina.nombre}</strong>.
                            Hoy diste un paso más para construir un hábito sostenible.
                        </p>

                        <div class="resumen-sesion">
                            <div><strong>${totalEjercicios}</strong><span>ejercicios</span></div>
                            <div><strong>${minutosSesion} min</strong><span>sesión</span></div>
                        </div>

                        <div class="calma-box">
                            ❤️ Escucha a tu cuerpo, hidrátate y date tiempo para recuperarte.
                        </div>

                        <button class="btn-siguiente" onclick="mostrarPlanDespuesDeEntrenamiento()">
                            📅 Volver a mi semana
                        </button>
                    </div>
                </div>
            </div>
        `;
    }


    function mostrarPlanDespuesDeEntrenamiento() {

        if (intervaloTimer) {
            clearInterval(intervaloTimer);
            intervaloTimer = null;
        }

        generarPlan();
    }


    /* =====================================================
       VOZ / FUTURO ASISTENTE
    ===================================================== */

    function hablarConNura() {

        alert(
            "🎙️ La conversación por voz con NURA será una de las próximas funciones. Aquí podremos conectar la voz y el asistente inteligente más adelante."
        );

    /* =====================================================

    mostrarPortada();

</script>
